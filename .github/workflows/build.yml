name: Rebuild list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deals/**', 'categories.json', 'scripts/**', 'README.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate && npm run build
      - name: Commit README and dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dist/deals.json
          git diff --cached --quiet || git commit -m "Rebuild list" && git push
